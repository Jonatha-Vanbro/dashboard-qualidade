<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Qualidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-gray-200 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Painel de Controle - Qualidade</h1>
                <p class="text-sm text-gray-500">Acompanhamento e melhoria contínua</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="carregarDadosPlanilha()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm cursor-pointer transition flex items-center gap-2">
                    🔄 Sincronizar Agora
                </button>
            </div>
        </div>

        <!-- Indicadores KPIs Atualizados -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
                <p class="text-xs text-gray-500 font-bold uppercase">Total de Registros</p>
                <p class="text-3xl font-extrabold text-gray-800 mt-1" id="kpi-total">0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-red-500">
                <p class="text-xs text-gray-500 font-bold uppercase">Principal Defeito</p>
                <p class="text-xl font-bold text-red-600 mt-1 truncate" id="kpi-principal-defeito">-</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-yellow-500">
                <p class="text-xs text-gray-500 font-bold uppercase">Maior Índice de Defeitos</p>
                <p class="text-xl font-bold text-yellow-600 mt-1 truncate" id="kpi-maior-componente">-</p>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-gray-700 mb-4">Modelos dos Equipamentos</h2>
                <canvas id="chartEquipamentos"></canvas>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-gray-700 mb-4">Clientes</h2>
                <canvas id="chartClientes"></canvas>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-gray-700 mb-4">Tipos de Defeitos</h2>
                <canvas id="chartDefeitos"></canvas>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold text-gray-700 mb-4">Componentes Afetados</h2>
                <canvas id="chartComponentes"></canvas>
            </div>
        </div>

    </div>

    <script>
        // COLE O SEU LINK PUBLICADO DO GOOGLE SHEETS ENTRE AS ASPAS:
        const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSaXyWBuLvG8G3VrwGcmMqk98vRk0V4L2Tv4rZnJispuDpLQIrjFmBC9UKLz0IrUDZxFhqqXZM-BB6s/pub?gid=0&single=true&output=csv";

        let chart1, chart2, chart3, chart4;

        async function carregarDadosPlanilha() {
            if (!URL_GOOGLE_SHEETS || URL_GOOGLE_SHEETS.includes("COLE_SEU_LINK")) {
                alert("Por favor, adicione o link publicado do Google Sheets na variável URL_GOOGLE_SHEETS.");
                return;
            }

            try {
                // Utiliza fetch com o serviço AllOrigins para evitar o erro CORS ao executar como arquivo local
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(URL_GOOGLE_SHEETS)}&timestamp=${new Date().getTime()}`;
                const resposta = await fetch(proxyUrl);
                const textoCsv = await resposta.text();

                Papa.parse(textoCsv, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processarDados(results.data);
                    }
                });
            } catch (erro) {
                console.error("Erro ao carregar os dados:", erro);
                alert("Não foi possível carregar os dados. Verifique a sua conexão ou a publicação da planilha.");
            }
        }

        function obterValorColuna(item, nomeBuscado) {
            const chave = Object.keys(item).find(k => k.trim().toLowerCase() === nomeBuscado.toLowerCase());
            return chave ? item[chave].trim() : '';
        }

        function contarOcorrencias(dados, nomeColuna) {
            const contagem = {};
            dados.forEach(item => {
                const valor = obterValorColuna(item, nomeColuna);
                if (valor) {
                    contagem[valor] = (contagem[valor] || 0) + 1;
                }
            });
            return contagem;
        }

        function obterMaisFrequente(objContagem) {
            let maxChave = '-';
            let maxValor = 0;
            for (const [chave, valor] of Object.entries(objContagem)) {
                if (valor > maxValor) {
                    maxValor = valor;
                    maxChave = chave;
                }
            }
            return maxValor > 0 ? `${maxChave} (${maxValor})` : '-';
        }

        function processarDados(dados) {
            document.getElementById('kpi-total').innerText = dados.length;
            
            const contagemDefeitos = contarOcorrencias(dados, 'Tipo de defeito');
            const contagemComponentes = contarOcorrencias(dados, 'Componente afetado');

            document.getElementById('kpi-principal-defeito').innerText = obterMaisFrequente(contagemDefeitos);
            document.getElementById('kpi-maior-componente').innerText = obterMaisFrequente(contagemComponentes);

            renderGraficoBarras('chartEquipamentos', contarOcorrencias(dados, 'Equipamento'), '#2563eb', chart1, g => chart1 = g);
            renderGraficoBarras('chartClientes', contarOcorrencias(dados, 'Cliente'), '#0d9488', chart2, g => chart2 = g);
            renderGraficoRosca('chartDefeitos', contagemDefeitos, chart3, g => chart3 = g);
            renderGraficoRosca('chartComponentes', contagemComponentes, chart4, g => chart4 = g);
        }

        function renderGraficoBarras(id, objDados, cor, instancia, salvarInstancia) {
            if (instancia) instancia.destroy();
            const ctx = document.getElementById(id).getContext('2d');
            const novoChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(objDados),
                    datasets: [{ label: 'Quantidade', data: Object.values(objDados), backgroundColor: cor }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
            salvarInstancia(novoChart);
        }

        function renderGraficoRosca(id, objDados, instancia, salvarInstancia) {
            if (instancia) instancia.destroy();
            const ctx = document.getElementById(id).getContext('2d');
            const novoChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(objDados),
                    datasets: [{
                        data: Object.values(objDados),
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#64748b']
                    }]
                },
                options: { responsive: true }
            });
            salvarInstancia(novoChart);
        }

        // Carrega os dados automaticamente assim que a página é aberta
        window.onload = carregarDadosPlanilha;
    </script>
</body>
</html>
