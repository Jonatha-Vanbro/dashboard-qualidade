<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Qualidade</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="p-4 md:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-xl shadow-sm border border-slate-200/80 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Painel de Controle - Qualidade</h1>
                <p class="text-xs text-slate-500 mt-0.5">Acompanhamento e melhoria contínua de equipamentos</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="ultima-atualizacao" class="text-xs text-slate-400 font-medium hidden sm:inline"></span>
                <button onclick="carregarDadosPlanilha()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all shadow-sm active:scale-95">
                    <i class="fa-solid fa-rotate" id="icon-sync"></i>
                    <span>Sincronizar Agora</span>
                </button>
            </div>
        </div>

        <!-- Cards de Métricas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total de Registros</p>
                    <i class="fa-solid fa-clipboard-list text-blue-500 text-lg"></i>
                </div>
                <p id="card-total" class="text-3xl font-black text-slate-800 mt-2">0</p>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-rose-500">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Principal Defeito</p>
                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-lg"></i>
                </div>
                <p id="card-defeito" class="text-lg font-bold text-rose-600 mt-2 truncate">-</p>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-amber-500">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Componente Mais Afetado</p>
                    <i class="fa-solid fa-microchip text-amber-500 text-lg"></i>
                </div>
                <p id="card-componente" class="text-lg font-bold text-amber-600 mt-2 truncate">-</p>
            </div>
        </div>

        <!-- Grid de Gráficos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Top Modelos -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-cube text-blue-500"></i> Ocorrências por Modelo (Top 8)
                </h2>
                <div class="relative h-64">
                    <canvas id="chartModelos"></canvas>
                </div>
            </div>

            <!-- Clientes -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-users text-emerald-500"></i> Ocorrências por Cliente
                </h2>
                <div class="relative h-64">
                    <canvas id="chartClientes"></canvas>
                </div>
            </div>

            <!-- Tipos de Defeito -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-rose-500"></i> Tipos de Defeitos
                </h2>
                <div class="relative h-64">
                    <canvas id="chartDefeitos"></canvas>
                </div>
            </div>

            <!-- Componentes Afetados -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-gears text-amber-500"></i> Componentes Afetados
                </h2>
                <div class="relative h-64">
                    <canvas id="chartComponentes"></canvas>
                </div>
            </div>

        </div>

    </div>

    <script>
        const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSaXyWBuLvG8G3VrwGcmMqk98vRk0V4L2Tv4rZnJispuDpLQIrjFmBC9UKLz0IrUDZxFhqqXZM-BB6s/pub?gid=0&single=true&output=csv";

        let chart1 = null, chart2 = null, chart3 = null, chart4 = null;

        // Padronizador de Texto: remove espaços extras e normaliza maiúsculas/minúsculas
        function padronizarTexto(texto) {
            if (!texto) return "";
            let t = texto.trim().toUpperCase();
            return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
        }

        async function carregarDadosPlanilha() {
            const icon = document.getElementById('icon-sync');
            if (icon) icon.classList.add('fa-spin');

            try {
                const resposta = await fetch(`${URL_GOOGLE_SHEETS}&t=${new Date().getTime()}`);
                if (!resposta.ok) throw new Error("Erro na requisição");
                
                const textoCsv = await resposta.text();

                Papa.parse(textoCsv, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processarDados(results.data);
                        const agora = new Date();
                        document.getElementById('ultima-atualizacao').innerText = `Atualizado às ${agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;
                    }
                });
            } catch (erro) {
                console.error("Erro ao carregar os dados:", erro);
                alert("Erro ao carregar a planilha.");
            } finally {
                if (icon) icon.classList.remove('fa-spin');
            }
        }

        function contarOcorrencias(dados, coluna) {
            const contagem = {};
            dados.forEach(item => {
                const valor = padronizarTexto(item[coluna]);
                if (valor) {
                    contagem[valor] = (contagem[valor] || 0) + 1;
                }
            });
            return contagem;
        }

        function obterMaior(contagem) {
            let maiorChave = "-";
            let maiorValor = 0;
            for (const [chave, valor] of Object.entries(contagem)) {
                if (valor > maiorValor) {
                    maiorValor = valor;
                    maiorChave = chave;
                }
            }
            return { chave: maiorChave, valor: maiorValor };
        }

        function ordenarEFiltrar(contagem, limite = 8) {
            const ordenado = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
            const resultado = {};
            ordenado.slice(0, limite).forEach(([k, v]) => resultado[k] = v);
            return resultado;
        }

        function processarDados(dados) {
            document.getElementById('card-total').innerText = dados.length;

            const chaves = dados.length > 0 ? Object.keys(dados[0]) : [];
            const colModelo = chaves.find(k => k.toLowerCase().includes("modelo") || k.toLowerCase().includes("equipamento")) || chaves[0];
            const colCliente = chaves.find(k => k.toLowerCase().includes("cliente")) || chaves[1];
            const colDefeito = chaves.find(k => k.toLowerCase().includes("defeito") || k.toLowerCase().includes("falha")) || chaves[2];
            const colComponente = chaves.find(k => k.toLowerCase().includes("componente") || k.toLowerCase().includes("peça")) || chaves[3];

            const contModelo = contarOcorrencias(dados, colModelo);
            const contCliente = contarOcorrencias(dados, colCliente);
            const contDefeito = contarOcorrencias(dados, colDefeito);
            const contComponente = contarOcorrencias(dados, colComponente);

            const principalDefeito = obterMaior(contDefeito);
            const principalComponente = obterMaior(contComponente);

            document.getElementById('card-defeito').innerText = principalDefeito.chave;
            document.getElementById('card-componente').innerText = principalComponente.chave;

            renderizarGraficos(
                ordenarEFiltrar(contModelo, 8), 
                contCliente, 
                contDefeito, 
                ordenarEFiltrar(contComponente, 8)
            );
        }

        function renderizarGraficos(modelos, clientes, defeitos, componentes) {
            const cores = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b'];

            // Gráfico 1 - Modelos (Barras Horizontais para não encavalar os nomes)
            if (chart1) chart1.destroy();
            chart1 = new Chart(document.getElementById('chartModelos'), {
                type: 'bar',
                data: {
                    labels: Object.keys(modelos),
                    datasets: [{ label: 'Ocorrências', data: Object.values(modelos), backgroundColor: '#3b82f6', borderRadius: 4 }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { ticks: { stepSize: 1 } } }
                }
            });

            // Gráfico 2 - Clientes (Pizza com Legenda à Direita)
            if (chart2) chart2.destroy();
            chart2 = new Chart(document.getElementById('chartClientes'), {
                type: 'pie',
                data: {
                    labels: Object.keys(clientes),
                    datasets: [{ data: Object.values(clientes), backgroundColor: cores }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });

            // Gráfico 3 - Defeitos (Rosca com Legenda à Direita)
            if (chart3) chart3.destroy();
            chart3 = new Chart(document.getElementById('chartDefeitos'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(defeitos),
                    datasets: [{ data: Object.values(defeitos), backgroundColor: cores }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });

            // Gráfico 4 - Componentes (Barras Horizontais com Rótulos Limpos)
            if (chart4) chart4.destroy();
            chart4 = new Chart(document.getElementById('chartComponentes'), {
                type: 'bar',
                data: {
                    labels: Object.keys(componentes),
                    datasets: [{ label: 'Ocorrências', data: Object.values(componentes), backgroundColor: '#f59e0b', borderRadius: 4 }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { ticks: { stepSize: 1 } } }
                }
            });
        }

        window.onload = carregarDadosPlanilha;
    </script>
</body>
</html>
