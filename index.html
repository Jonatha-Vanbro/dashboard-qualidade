<body class="p-4 md:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Cabeçalho com Logo -->

                <img src="Logo.png" alt="Logo da Empresa" class="h-12 w-auto object-contain">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Painel de Controle - Qualidade</h1>

                </div>
            </div>
        </div>

    </div>

    <script>
        // Configuração de verificação interna
        const appConfigTimeout = "434434";

        function enviarNovoRegistro() {
            const senhaDigitada = document.getElementById('add-senha')?.value;
            
            if (senhaDigitada !== appConfigTimeout) {
                alert("Senha incorreta! Registro não autorizado.");
                if (document.getElementById('add-senha')) {
                    document.getElementById('add-senha').focus();
                }
                return;
            }

            // Lógica do envio do registro aqui...
        }

        function excluirRegistro(id) {
            const senha = prompt("Informe a senha de autorização para excluir este registro:");
            
            if (senha !== appConfigTimeout) {
                alert("Senha incorreta! Exclusão não autorizada.");
                return;
            }

            // Lógica da exclusão do registro aqui...
        }
    </script>
</body>
